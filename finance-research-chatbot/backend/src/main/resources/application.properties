# Spring Boot Configuration
spring.application.name=finance-research-chatbot
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:finance_research}
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD:app_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration for Debug
logging.level.com.deqode.financeresearch=INFO
logging.level.com.deqode.financeresearch.service.ThreadService=INFO
logging.level.com.deqode.financeresearch.service.ResearchService=INFO
logging.level.com.deqode.financeresearch.controller=INFO

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# JWT Configuration
app.jwt.secret=${JWT_SECRET:default-secret-key-change-in-production}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# LLM Configuration
app.llm.provider=${LLM_PROVIDER:groq}
app.llm.groq.api-key=${GROQ_API_KEY:}
app.llm.openai.api-key=${OPENAI_API_KEY:}
app.llm.gemini.api-key=${GEMINI_API_KEY:}
app.llm.claude.api-key=${CLAUDE_API_KEY:}

# Search Provider Configuration
app.search.provider=${SEARCH_PROVIDER:tavily}
app.search.tavily.api-key=${TAVILY_API_KEY:}
app.search.brave.api-key=${BRAVE_API_KEY:}
app.search.serper.api-key=${SERPER_API_KEY:}

# Web Crawling Configuration
app.crawl.max-pages=${MAX_CRAWL_PAGES:10}
app.crawl.timeout=${CRAWL_TIMEOUT:30000}

# Memory Configuration
app.memory.short-term-ttl=${SHORT_TERM_MEMORY_TTL:3600}
app.memory.max-thread-messages=${MAX_THREAD_MESSAGES:100}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.deqode.financeresearch=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=DEBUG